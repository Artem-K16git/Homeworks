---
- name: Deploy Elasticsearch (final configuration)
  hosts: elasticsearch
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - include_tasks: elasticsearch/install.yml

  handlers:
    - name: restart elasticsearch
      systemd:
        name: elasticsearch
        state: restarted

- name: Deploy Kibana (final configuration)
  hosts: kibana
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - include_tasks: kibana/install.yml

  handlers:
    - name: restart kibana
      systemd:
        name: kibana
        state: restarted

- name: Deploy Filebeat to web servers
  hosts: webservers
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - include_tasks: filebeat/install.yml

  handlers:
    - name: restart filebeat
      systemd:
        name: filebeat
        state: restarted
