---
- name: Add Elasticsearch repository from Yandex mirror
  apt_repository:
    repo: "{{ elasticsearch_repo_url }}"
    state: present
    filename: elasticsearch
    update_cache: yes

- name: Stop and remove existing Elasticsearch
  systemd:
    name: elasticsearch
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove existing Elasticsearch installation
  apt:
    name: elasticsearch
    state: absent
    purge: yes
  ignore_errors: yes

- name: Clean up Elasticsearch directories
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/elasticsearch
    - /var/lib/elasticsearch
    - /var/log/elasticsearch
  ignore_errors: yes

- name: Create fresh Elasticsearch directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/elasticsearch
    - /var/lib/elasticsearch
    - /var/log/elasticsearch

- name: Install Elasticsearch (this creates elasticsearch user)
  apt:
    name: "elasticsearch={{ elasticsearch_version }}"
    state: present

- name: Configure Elasticsearch
  template:
    src: "../templates/elasticsearch.yml.j2"
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: elasticsearch
    group: elasticsearch
    mode: 0644

- name: Clean up any existing SSL configurations
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/elasticsearch/certs
    - /etc/elasticsearch/elasticsearch.keystore
  ignore_errors: yes

- name: Configure minimal JVM options
  copy:
    content: |
      -Xms512m
      -Xmx512m
      -XX:+UseG1GC
      -Djava.io.tmpdir=/tmp
    dest: /etc/elasticsearch/jvm.options
    owner: elasticsearch
    group: elasticsearch
    mode: 0644

- name: Fix permissions after elasticsearch user is created
  file:
    path: "{{ item }}"
    owner: elasticsearch
    group: elasticsearch
    recurse: yes
  loop:
    - /etc/elasticsearch
    - /var/lib/elasticsearch
    - /var/log/elasticsearch

- name: Start and enable Elasticsearch service
  systemd:
    name: elasticsearch
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Elasticsearch to start
  wait_for:
    port: 9200
    delay: 5
    state: started
    timeout: 60

- name: Verify Elasticsearch is running
  uri:
    url: "http://localhost:9200"
    method: GET
  register: es_status
  until: es_status.status == 200
  retries: 15
  delay: 5

- name: Show Elasticsearch status
  debug:
    msg: "Elasticsearch is running successfully"
  when: es_status.status == 200
