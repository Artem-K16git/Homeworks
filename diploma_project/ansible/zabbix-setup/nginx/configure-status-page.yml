---
- name: Create Nginx status page configuration
  template:
    src: ../templates/nginx-status.conf.j2
    dest: /etc/nginx/conf.d/status.conf
    backup: yes
  notify: Reload Nginx  # Вызывает хук при изменении конфига


- name: Test Nginx configuration
  command: nginx -t
  register: nginx_test
  changed_when: false

- name: Reload Nginx if configuration is valid
  systemd:
    name: nginx
    state: reloaded
  when: nginx_test.rc == 0

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: started

handlers:
  - name: Reload Nginx
    systemd:
      name: nginx
      state: reloaded

